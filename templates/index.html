<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming_Agent Workspace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            background-color: #111827;
            color: #e5e7eb;
            height: 100vh;
            overflow: hidden;
        }

        /* ------------------ SIDEBAR STYLING ------------------ */
        .sidebar {
            width: 260px;
            background-color: #1f2937;
            border-right: 1px solid #374151;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .workspace-badge {
            background: linear-gradient(135deg, #3b82f620, #8b5cf620);
            border: 1px solid #8b5cf640;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .badge-tag {
            background-color: #8b5cf6;
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .workspace-title {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .system-status {
            font-size: 0.75rem;
            color: #10b981;
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .premium-text {
            font-size: 0.7rem;
            color: #9ca3af;
            margin-top: 0.2rem;
        }

        .new-chat-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.2s;
            margin-bottom: 2rem;
        }

        .new-chat-btn:hover {
            background-color: #1d4ed8;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .history-item {
            padding: 0.6rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #d1d5db;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.25rem;
            transition: background 0.2s;
        }

        .history-item:hover, .history-item.active {
            background-color: #374151;
            color: white;
        }

        .delete-chat-btn {
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        .delete-chat-btn:hover {
            color: #ef4444;
        }

        /* ------------------ MAIN CONTAINER ------------------ */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
            position: relative;
        }

        .header-bar {
            height: 60px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 1rem;
        }

        .menu-toggle {
            background-color: #334155;
            border: none;
            color: white;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .active-thread-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ------------------ CHAT WINDOW AREAS ------------------ */
        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding-bottom: 120px;
        }

        .system-banner {
            background-color: #1e293b80;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            align-self: flex-start;
            max-width: 600px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.bot {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .msg-bubble {
            background-color: #2563eb;
            color: white;
            border-top-right-radius: 0;
        }

        .bot .msg-bubble {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-top-left-radius: 0;
        }

        .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            color: #3b82f6;
        }
        .msg-bubble code {
            background-color: #0f172a;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #f43f5e;
        }
        .msg-bubble pre {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid #334155;
        }
        .msg-bubble pre code {
            background: none;
            padding: 0;
            color: #10b981;
        }

        /* ------------------ INPUT BAR CONTAINER ------------------ */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2rem;
            background: linear-gradient(transparent, #0f172a 30%);
        }

        .input-form {
            display: flex;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.5rem;
            align-items: center;
            gap: 0.5rem;
        }

        .text-input {
            flex: 1;
            background: none;
            border: none;
            color: white;
            padding: 0.75rem;
            font-size: 0.95rem;
            outline: none;
        }

        .text-input::placeholder {
            color: #64748b;
        }

        .submit-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .submit-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="workspace-badge">
            <span class="badge-tag">Query Agent</span>
            <div class="workspace-title">
                <i class="fa-solid fa-gear" style="color: #3b82f6;"></i> Active Workspace
            </div>
            <div class="system-status">
                <i class="fa-solid fa-shield-halved"></i> System Core: Connected
            </div>
            <div class="premium-text">Premium AI Access Enabled via Server</div>
        </div>

        <button class="new-chat-btn" id="newThreadBtn">
            <i class="fa-solid fa-plus"></i> + New Chat Thread
        </button>

        <div class="section-label">Saved Discussions</div>
        <ul class="history-list" id="chatHistoryList"></ul>
    </div>

    <div class="main-container">
        <div class="header-bar">
            <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
            <div class="active-thread-title" id="currentThreadHeader">
                🎓 Programming_Agent - Default Chat
            </div>
        </div>

        <div class="chat-window" id="chatWindow">
            <div class="system-banner">
                New active session workspace [<span id="bannerSessionName">Default Chat</span>] instantiated. Ask me anything!
            </div>
        </div>

        <div class="input-container">
            <form class="input-form" id="chatForm">
                <input type="text" class="text-input" id="userInput" placeholder="Ask a programming question..." autocomplete="off" required>
                <button type="submit" class="submit-btn">Send Prompt</button>
            </form>
        </div>
    </div>

    <script>
        let currentChatName = "Default Chat";

        function formatMarkdown(text) {
            let clean = text;
            clean = clean.replace(/```javascript([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            clean = clean.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            clean = clean.replace(/`([^`]+)`/g, '<code>$1</code>');
            clean = clean.replace(/### (.*)/g, '<h3>$1</h3>');
            clean = clean.replace(/## (.*)/g, '<h2>$1</h2>');
            clean = clean.replace(/# (.*)/g, '<h1>$1</h1>');
            clean = clean.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            return clean;
        }

        async function fetchSavedThreads() {
            try {
                const res = await fetch('/get_chats');
                const data = await res.json();
                const container = document.getElementById('chatHistoryList');
                container.innerHTML = "";

                data.forEach(chat => {
                    const li = document.createElement('li');
                    li.className = `history-item ${chat.name === currentChatName ? 'active' : ''}`;
                    
                    const textSpan = document.createElement('span');
                    textSpan.style.flex = "1";
                    textSpan.innerHTML = `<i class="fa-regular fa-message" style="margin-right: 8px;"></i> ${chat.name}`;
                    textSpan.onclick = () => switchToThread(chat.name, chat.messages || []);
                    
                    const deleteIcon = document.createElement('i');
                    deleteIcon.className = "fa-solid fa-trash-can delete-chat-btn";
                    deleteIcon.onclick = (e) => {
                        e.stopPropagation(); // Stops the list item selection click event from hijacking the deletion
                        deleteThread(chat.name);
                    };

                    li.appendChild(textSpan);
                    li.appendChild(deleteIcon);
                    container.appendChild(li);
                });
            } catch (err) {
                console.error("Failed loading chat logs from sidebar server:", err);
            }
        }

        async function switchToThread(name, messages = []) {
            currentChatName = name;
            document.getElementById('currentThreadHeader').innerText = `🎓 Programming_Agent - ${name}`;
            document.getElementById('bannerSessionName').innerText = name;
            
            const windowEl = document.getElementById('chatWindow');
            windowEl.innerHTML = `
                <div class="system-banner">
                    New active session workspace [${name}] instantiated. Ask me anything!
                </div>
            `;

            messages.forEach(msg => {
                if (msg.user) appendBubble(msg.user, 'user');
                if (msg.bot) appendBubble(msg.bot, 'bot');
            });

            await fetchSavedThreads();
            scrollCanvas();
        }

        function appendBubble(text, sender) {
            const container = document.getElementById('chatWindow');
            const wrap = document.createElement('div');
            wrap.className = `message ${sender}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerHTML = sender === 'bot' ? formatMarkdown(text) : text;
            
            wrap.appendChild(bubble);
            container.appendChild(wrap);
            scrollCanvas();
        }

        function scrollCanvas() {
            const win = document.getElementById('chatWindow');
            win.scrollTop = win.scrollHeight;
        }

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            appendBubble(msg, 'user');
            input.value = "";

            try {
                const res = await fetch('/get', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, chat_name: currentChatName })
                });
                const data = await res.json();
                
                if(data.updated_chat_name && currentChatName !== data.updated_chat_name) {
                    currentChatName = data.updated_chat_name;
                    document.getElementById('currentThreadHeader').innerText = `🎓 Programming_Agent - ${currentChatName}`;
                    document.getElementById('bannerSessionName').innerText = currentChatName;
                }
                
                appendBubble(data.response, 'bot');
                await fetchSavedThreads();
            } catch {
                appendBubble("❌ Execution error connecting to server module pipeline.", 'bot');
            }
        });

        document.getElementById('newThreadBtn').addEventListener('click', async () => {
            try {
                // Instantly generates a clean, unique placeholder name string
                const tempName = `New Chat Thread (${Math.floor(Math.random() * 900) + 100})`;
                
                // Immediately saves it to the hard drive backend json array database
                const saveRes = await fetch('/save_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: tempName, messages: [] })
                });
                
                if (saveRes.ok) {
                    switchToThread(tempName, []);
                }
            } catch (err) {
                console.error("Error handling thread registration:", err);
            }
        });

        async function deleteThread(name) {
            if (!confirm(`Delete session thread [${name}] permanently?`)) return;
            
            try {
                const res = await fetch('/delete-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_name: name })
                });
                
                const data = await res.json();
                if (data.success) {
                    const checkRes = await fetch('/get_chats');
                    const remainingChats = await checkRes.json();
                    
                    if (remainingChats.length > 0) {
                        switchToThread(remainingChats[0].name, remainingChats[0].messages || []);
                    } else {
                        // Clean reset fallback block if everything is completely cleared
                        await fetch('/save_chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: "Default Chat", messages: [] })
                        });
                        switchToThread("Default Chat", []);
                    }
                }
            } catch (err) {
                console.error("Deletion pipeline execution failure:", err);
            }
        }

        document.querySelector('.menu-toggle').addEventListener('click', () => {
            const sidebar = document.querySelector('.sidebar');
            sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
        });

        // Live initialization setup
        window.onload = async () => {
            try {
                const res = await fetch('/get_chats');
                const data = await res.json();
                
                if (data.length > 0) {
                    switchToThread(data[0].name, data[0].messages || []);
                } else {
                    await fetch('/save_chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: "Default Chat", messages: [] })
                    });
                    switchToThread("Default Chat", []);
                }
            } catch {
                switchToThread("Default Chat", []);
            }
        };
    </script>
</body>
</html>
