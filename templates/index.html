<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Curriculum Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #1a1a1a; color: #fff; }
        
        /* Sidebar Styling */
        .sidebar { width: 280px; background-color: #111; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .new-chat-btn { margin: 15px; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        .new-chat-btn:hover { background: #1d4ed8; }
        .chat-list { flex: 1; overflow-y: auto; padding: 0 10px; }
        .chat-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin-bottom: 5px; border-radius: 5px; cursor: pointer; background: #222; font-size: 13px; }
        .chat-item:hover, .chat-item.active { background: #2d2d2d; }
        .chat-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 80%; }
        .delete-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 14px; display: none; }
        .chat-item:hover .delete-btn { display: block; }

        /* Main Workspace Panel */
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #1e1e1e; }
        .chat-header { padding: 15px 20px; background-color: #181818; border-bottom: 1px solid #333; font-size: 16px; font-weight: 600; color: #ccc; }
        .message-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Bubble Configurations */
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
        .user-msg { background-color: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 1px; }
        .bot-msg { background-color: #2a2a2a; color: #e5e7eb; align-self: flex-start; border-bottom-left-radius: 1px; border: 1px solid #3c3c3c; }
        
        /* Code Box inside Responses */
        .bot-msg pre { background: #111; padding: 12px; border-radius: 5px; overflow-x: auto; margin-top: 8px; border: 1px solid #444; }
        .bot-msg code { font-family: 'Courier New', Courier, monospace; color: #f472b6; font-size: 13px; }
        .bot-msg h1, .bot-msg h3 { margin-bottom: 8px; color: #fff; font-size: 16px; }
        .bot-msg p { margin-bottom: 6px; }

        /* Interactive Input Panel */
        .input-panel { padding: 20px; background-color: #181818; border-top: 1px solid #333; display: flex; gap: 10px; }
        .input-panel input { flex: 1; padding: 14px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: white; font-size: 14px; outline: none; }
        .input-panel input:focus { border-color: #2563eb; }
        .input-panel button { padding: 0 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .input-panel button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">+ New Conversation</button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="chat-area">
        <div class="chat-header" id="currentChatTitle">Default Chat</div>
        <div class="message-container" id="msgContainer"></div>
        <div class="input-panel">
            <input type="text" id="userInput" placeholder="Ask about Python, Java, or C structures..." onkeydown="if(event.key==='Enter') sendPrompt()">
            <button onclick="sendPrompt()">Send</button>
        </div>
    </div>

    <script>
        let currentChatName = "Default Chat";

        window.onload = function() {
            fetchSavedChats();
        };

        function fetchSavedChats() {
            fetch('/get_chats')
                .then(res => res.json())
                .then(data => {
                    renderSidebar(data);
                    if(data.length > 0) {
                        loadChatWindow(data[data.length - 1].name, data);
                    } else {
                        createNewChat();
                    }
                });
        }

        function renderSidebar(chats) {
            const list = document.getElementById("chatList");
            list.innerHTML = "";
            chats.forEach(chat => {
                const item = document.createElement("div");
                item.className = `chat-item ${chat.name === currentChatName ? 'active' : ''}`;
                item.onclick = () => loadChatWindow(chat.name);
                
                const label = document.createElement("span");
                label.innerText = chat.name;
                
                const delBtn = document.createElement("button");
                delBtn.className = "delete-btn";
                delBtn.innerHTML = "🗑️";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteChatThread(chat.name);
                };

                item.appendChild(label);
                item.appendChild(delBtn);
                list.appendChild(item);
            });
        }

        function loadChatWindow(name, optionalData = null) {
            currentChatName = name;
            document.getElementById("currentChatTitle").innerText = name;
            
            if(optionalData) {
                displayMessages(optionalData.find(c => c.name === name));
                renderSidebar(optionalData);
            } else {
                fetch('/get_chats').then(res => res.json()).then(chats => {
                    displayMessages(chats.find(c => c.name === name));
                    renderSidebar(chats);
                });
            }
        }

        function displayMessages(chatObj) {
            const container = document.getElementById("msgContainer");
            container.innerHTML = "";
            if(!chatObj || !chatObj.messages) return;

            chatObj.messages.forEach(msg => {
                if(msg.user) appendBubble(msg.user, "user-msg");
                if(msg.bot) appendBubble(msg.bot, "bot-msg");
            });
            container.scrollTop = container.scrollHeight;
        }

        function createNewChat() {
            const tempName = "New Chat Thread " + Math.floor(Math.random() * 1000);
            currentChatName = tempName;
            document.getElementById("currentChatTitle").innerText = "New Chat Session";
            document.getElementById("msgContainer").innerHTML = "";

            fetch('/save_chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: tempName, messages: [] })
            }).then(() => fetchSavedChats());
        }

        function deleteChatThread(name) {
            fetch('/delete-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_name: name })
            }).then(() => fetchSavedChats());
        }

        function appendBubble(text, cssClass) {
            const container = document.getElementById("msgContainer");
            const bubble = document.createElement("div");
            bubble.className = `msg ${cssClass}`;
            
            if (cssClass === "bot-msg") {
                bubble.innerHTML = marked.parse(text); // Renders structured markdown and syntax properly
            } else {
                bubble.innerText = text;
            }
            
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        function sendPrompt() {
            const input = document.getElementById("userInput");
            const query = input.value.trim();
            if(!query) return;

            appendBubble(query, "user-msg");
            input.value = "";

            fetch('/get', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: query, chat_name: currentChatName })
            })
            .then(res => res.json())
            .then(data => {
                appendBubble(data.response, "bot-msg");
                if (data.updated_chat_name && data.updated_chat_name !== currentChatName) {
                    currentChatName = data.updated_chat_name;
                    document.getElementById("currentChatTitle").innerText = currentChatName;
                }
                fetch('/get_chats').then(r => r.json()).then(chats => renderSidebar(chats));
            });
        }
    </script>
</body>
</html>
